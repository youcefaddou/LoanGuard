version: '3.8'

services:
  # Base de données MySQL
  db:
    image: mysql:8.4-oracle
    container_name: loanguard-db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: loanguard
      MYSQL_USER: root
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - loanguard-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # Backend API Node.js
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: loanguard-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://root:@db:3306/loanguard
      JWT_SECRET: e25aac890fbd9260c98cc75f6dc3f7ad9f5bd93c4f4e73a8188a26014a7463bf
      NODE_ENV: production
      PORT: 4000
      SIRENE_API_KEY: 53d48e08-d489-4589-948e-08d489f58982
      OPENWEATHER_API_KEY: b7ed4a6a35d5ad3addad7d184b5cb82d
      FRONTEND_URL: http://nginx:80/app
    ports:
      - "4000:4000"
    networks:
      - loanguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend React App
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loanguard-frontend
    depends_on:
      - backend
    ports:
      - "3001:80"
    networks:
      - loanguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Landing Page Next.js
  landing:
    build: 
      context: ./landing
      dockerfile: Dockerfile
    container_name: loanguard-landing
    ports:
      - "3002:80"
    networks:
      - loanguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Reverse Proxy Nginx Principal
  nginx:
    image: cgr.dev/chainguard/nginx:latest
    container_name: loanguard-proxy
    depends_on:
      - frontend
      - landing
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - loanguard-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

# Volumes persistants
volumes:
  mysql_data:
    driver: local

# Réseau isolé
networks:
  loanguard-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16